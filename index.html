<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sequence Simulation</title>
<style>
  body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #000; color: #fff; }
  .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .scene.show { animation: fadeInOut linear forwards; }
  @keyframes fadeInOut {
    0% { opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { opacity: 0; }
  }
  #scene1 { background: #111; }
  #scene1 .phone { width: 200px; height: 400px; border: 4px solid #333; border-radius: 20px; position: relative; }
  #scene1 .timer { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 24px; color: red; }
  #scene2 { background: #002b36; }
  #scene2 .hourglass { width: 100px; height: 150px; border: 4px solid #ccc; border-radius: 50px; position: relative; }
  #scene3 { background: linear-gradient(#002b36, #004); flex-direction: column; }
  #scene3 .waveform { width: 80%; height: 100px; background: repeating-linear-gradient(90deg, teal, teal 2px, transparent 2px, transparent 4px); }
  #scene4 { background: #000; flex-direction: column; }
  #scene4 .metrics { text-align: center; }
  #scene4 .metric { font-size: 32px; margin: 10px 0; color: #0ff; }
  #scene5 { background: #222; }
  #scene5 .selfie { width: 200px; height: 300px; background: #666; border-radius: 10px; }
</style>
</head>
<body>
<div id="scene1" class="scene" style="animation-duration:3s; animation-delay:0s;">
  <div class="phone">
    <div class="timer">120 s QUEUE TIME</div>
  </div>
</div>
<div id="scene2" class="scene" style="animation-duration:3s; animation-delay:3s;">
  <div class="hourglass">Hourglass Shatter - Logo A</div>
</div>
<div id="scene3" class="scene" style="animation-duration:5s; animation-delay:6s;">
  <div class="waveform"></div>
  <div>Live transcription en cours...</div>
</div>
<div id="scene4" class="scene" style="animation-duration:2s; animation-delay:11s;">
  <div class="metrics">
    <div class="metric">NPS +90</div>
    <div class="metric">Call Cost -70%</div>
  </div>
</div>
<div id="scene5" class="scene" style="animation-duration:2s; animation-delay:13s;">
  <div class="selfie">Client Selfie</div>
</div>
<script>
const scenes = document.querySelectorAll('.scene');
scenes.forEach((scene) => scene.classList.add('show')); 
</script>
</body>
</html>
